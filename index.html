<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Cadastros</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 15px; margin: 0; }
        .topo { background: #007bff; color: white; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-add { background: #28a745; color: white; padding: 10px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        #busca { width: 100%; padding: 12px; border: 2px solid #007bff; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; font-size: 16px; }
        .cartao { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #007bff; }
        .foto { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-right: 15px; background: #eee; }
        .info { flex-grow: 1; }
        .info h4 { margin: 0; font-size: 16px; text-transform: uppercase; }
        .info p { margin: 2px 0; font-size: 13px; color: #555; }
        .btn-ver { background: #ffc107; color: black; border: none; padding: 10px; border-radius: 5px; text-decoration: none; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="topo">
        <h2 style="margin:0">SISTEMA</h2>
        <a href="cadastro.html" class="btn-add">+ NOVO</a>
    </div>
    <input type="text" id="busca" placeholder="🔍 Buscar Nome ou CPF..." onkeyup="filtrar()">
    <div id="listaContainer"></div>

    <script>
        function carregar() {
            const lista = JSON.parse(localStorage.getItem('banco_final') || '[]');
            const container = document.getElementById('listaContainer');
            container.innerHTML = lista.length === 0 ? '<p style="text-align:center; color:#999; margin-top:50px;">Nenhum dado salvo.</p>' : "";

            lista.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'cartao';
                item.innerHTML = `
                    <img src="${p.foto || 'https://via.placeholder.com/60'}" class="foto">
                    <div class="info">
                        <h4>${p.nome}</h4>
                        <p><b>CPF:</b> ${p.cpf}</p>
                    </div>
                    <a href="cadastro.html?edit=${index}" class="btn-ver">VER</a>
                `;
                container.appendChild(item);
            });
        }
        function filtrar() {
            let termo = document.getElementById('busca').value.toLowerCase();
            let cartoes = document.getElementsByClassName('cartao');
            for (let c of cartoes) {
                c.style.display = c.innerText.toLowerCase().includes(termo) ? "flex" : "none";
            }
        }
        window.onload = carregar;
    </script>
</body>
</html>
