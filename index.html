<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA TÁTICO</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: white; padding: 15px; margin: 0; }
        .topo { background: #1a1a1a; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #d32f2f; }
        #busca { width: 100%; padding: 15px; border: none; border-radius: 8px; margin: 15px 0; font-size: 16px; background: #222; color: white; border: 1px solid #333; }
        .cartao { background: #1a1a1a; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; border-left: 5px solid #d32f2f; text-decoration: none; color: white; }
        .foto-lista { width: 60px; height: 60px; border-radius: 5px; object-fit: cover; margin-right: 15px; background: #333; }
        .info { flex-grow: 1; text-transform: uppercase; }
        .info h4 { margin: 0; font-size: 14px; }
        .info p { margin: 2px 0; font-size: 11px; color: #aaa; }
        .btn-abrir { background: #d32f2f; color: white; padding: 8px 12px; border-radius: 5px; font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>
    <div class="topo">
        <h3 style="margin:0">SISTEMA TÁTICO</h3>
        <a href="cadastro.html" style="background:#2e7d32; color:white; padding:10px 15px; border-radius:5px; text-decoration:none; font-weight:bold;">+ NOVO</a>
    </div>
    
    <input type="text" id="busca" placeholder="🔍 BUSCAR..." oninput="filtrar()">
    <div id="listaContainer"></div>

    <script>
        const DB_NAME = 'SISTEMA_TATICO_ESTAVEL';

        function carregar() {
            const container = document.getElementById('listaContainer');
            const lista = JSON.parse(localStorage.getItem(DB_NAME) || '[]');
            container.innerHTML = "";
            
            lista.forEach((p, index) => {
                const item = document.createElement('a');
                item.href = `cadastro.html?edit=${index}`;
                item.className = 'cartao';
                item.innerHTML = `
                    <img src="${p.foto || 'https://via.placeholder.com/60'}" class="foto-lista">
                    <div class="info">
                        <h4>${p.nome || '---'}</h4>
                        <p>VULGO: ${p.vulgo || 'N/I'} | STATUS: ${p.status || '---'}</p>
                    </div>
                    <span class="btn-abrir">ABRIR</span>
                `;
                container.appendChild(item);
            });
        }

        function filtrar() {
            const termo = document.getElementById('busca').value.toUpperCase();
            const cards = document.getElementsByClassName('cartao');
            for (let c of cards) {
                c.style.display = c.innerText.toUpperCase().includes(termo) ? "flex" : "none";
            }
        }
        window.onload = carregar;
    </script>
</body>
</html>
