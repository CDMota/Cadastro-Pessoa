<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FICHA OPERACIONAL</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: #ddd; padding: 10px; text-transform: uppercase; }
        .caixa { background: #151515; padding: 15px; border-radius: 10px; max-width: 500px; margin: auto; border: 1px solid #333; }
        label { display: block; margin-top: 10px; font-size: 10px; color: #888; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 5px; background: #222; color: white; font-size: 14px; text-transform: uppercase; box-sizing: border-box; }
        .duas-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        #preview { width: 140px; height: 140px; border-radius: 8px; object-fit: cover; display: block; margin: 0 auto 10px; border: 2px solid #d32f2f; background: #222; }
        .btn { border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; margin-top: 10px; cursor: pointer; text-align: center; color: white; text-decoration: none; display: block; }
        .btn-salvar { background: #2e7d32; }
        .btn-whats { background: #25d366; color: black; }
        .btn-tele { background: #0088cc; }
        .btn-gps { background: #6a1b9a; width: 50px; }
        .btn-del { background: #b71c1c; }
    </style>
</head>
<body>

<div class="caixa">
    <img id="preview" src="">
    <input type="file" id="foto" accept="image/*" style="font-size:10px;">

    <form id="formFinal">
        <label>NOME COMPLETO</label>
        <input type="text" id="nome" required>
        
        <label>NOME DA MÃE</label>
        <input type="text" id="mae">

        <div class="duas-col">
            <div><label>VULGO</label><input type="text" id="vulgo"></div>
            <div><label>CPF</label><input type="tel" id="cpf"></div>
        </div>

        <div class="duas-col">
            <div><label>NASCIMENTO</label><input type="tel" id="dataNasc" placeholder="00/00/0000" maxlength="10"></div>
            <div><label>SEXO</label>
                <select id="sexo">
                    <option value="MASCULINO">MASCULINO</option>
                    <option value="FEMININO">FEMININO</option>
                </select>
            </div>
        </div>

        <label>NATUREZA</label>
        <select id="natureza" onchange="verificarAbordado()">
            <option value="">SELECIONE...</option>
            <option value="ABORDADO">ABORDADO</option>
            <option value="PRISÃO">PRISÃO</option>
            <option value="AVERIGUAÇÃO">AVERIGUAÇÃO</option>
        </select>

        <div class="duas-col">
            <div><label>DATA/HORA</label><input type="text" id="dataOcorrencia"></div>
            <div><label>STATUS</label>
                <select id="status">
                    <option value="ABORDADO">ABORDADO</option>
                    <option value="PRESO">PRESO</option>
                    <option value="FORAGIDO">FORAGIDO</option>
                    <option value="TORNOZELEIRA">TORNOZELEIRA</option>
                    <option value="FALECIDO">FALECIDO</option>
                </select>
            </div>
        </div>

        <label>GPS (LOCALIZAÇÃO)</label>
        <div style="display:flex; gap:5px;">
            <input type="text" id="gps" readonly placeholder="COORDENADAS">
            <button type="button" class="btn-gps" onclick="pegarGPS()">📍</button>
        </div>

        <label>ENDEREÇO / OBS / BO</label>
        <textarea id="obs" rows="3"></textarea>

        <button type="submit" class="btn btn-salvar">💾 SALVAR E BAIXAR FOTO</button>
        
        <div id="areaAcao" style="display:none;">
            <button type="button" class="btn btn-whats" onclick="enviar('WA')">🟢 COMPARTILHAR WHATSAPP</button>
            <button type="button" class="btn btn-tele" onclick="enviar('TG')">🔵 COMPARTILHAR TELEGRAM</button>
            <button type="button" class="btn btn-del" onclick="excluir()">🗑️ EXCLUIR REGISTRO</button>
        </div>
        
        <a href="index.html" class="btn" style="background:#444;">VOLTAR PARA LISTA</a>
    </form>
</div>

<script>
    const DB_NAME = 'SISTEMA_TATICO_ESTAVEL';
    const params = new URLSearchParams(window.location.search);
    const editIndex = params.get('edit');
    let fotoBase64 = "";

    function verificarAbordado() {
        if(document.getElementById('natureza').value === "ABORDADO") {
            document.getElementById('dataOcorrencia').value = new Date().toLocaleString('pt-BR').toUpperCase();
        }
    }

    function pegarGPS() {
        navigator.geolocation.getCurrentPosition(pos => {
            document.getElementById('gps').value = `${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`;
        });
    }

    // --- CORREÇÃO: CARREGAR DADOS ---
    window.onload = () => {
        if (editIndex !== null) {
            const lista = JSON.parse(localStorage.getItem(DB_NAME) || '[]');
            const p = lista[editIndex];
            if (p) {
                document.getElementById('areaAcao').style.display = "block";
                // Preenche cada campo pelo ID
                Object.keys(p).forEach(key => {
                    const el = document.getElementById(key);
                    if (el) el.value = p[key];
                });
                if (p.foto) {
                    document.getElementById('preview').src = p.foto;
                    fotoBase64 = p.foto;
                }
            }
        }
    };

    function baixarFoto() { 
        if(!fotoBase64) return; 
        const a = document.createElement('a'); 
        a.href = fotoBase64; 
        a.download = `FOTO_${document.getElementById('nome').value.replace(/\s/g, '_')}.jpg`; 
        document.body.appendChild(a);
        a.click(); 
        document.body.removeChild(a);
    }

    document.getElementById('formFinal').onsubmit = e => {
        e.preventDefault();
        let lista = JSON.parse(localStorage.getItem(DB_NAME) || '[]');
        const dados = {};
        // Captura todos os inputs e selects
        document.querySelectorAll('input, select, textarea').forEach(i => {
            if(i.id) dados[i.id] = i.value.toUpperCase();
        });
        dados.foto = fotoBase64;

        if (editIndex !== null) lista[editIndex] = dados; else lista.push(dados);
        localStorage.setItem(DB_NAME, JSON.stringify(lista));

        baixarFoto();
        document.getElementById('areaAcao').style.display = "block";
        alert("✅ DADOS SALVOS E FOTO BAIXADA!");
    };

    // --- CORREÇÃO: COMPARTILHAR TUDO ---
    function enviar(tipo) {
        const getV = (id) => document.getElementById(id).value.toUpperCase();
        
        const msg = `📌 *RELATÓRIO OPERACIONAL*%0A%0A` +
                    `👤 *NOME:* ${getV('nome')}%0A` +
                    `👩‍👦 *MÃE:* ${getV('mae')}%0A` +
                    `🎭 *VULGO:* ${getV('vulgo')}%0A` +
                    `💳 *CPF:* ${getV('cpf')}%0A` +
                    `📅 *NASC:* ${getV('dataNasc')}%0A` +
                    `⚥ *SEXO:* ${getV('sexo')}%0A` +
                    `⚖️ *NATUREZA:* ${getV('natureza')}%0A` +
                    `🕒 *DATA/HORA:* ${getV('dataOcorrencia')}%0A` +
                    `🛡️ *STATUS:* ${getV('status')}%0A` +
                    `📝 *OBS:* ${getV('obs')}%0A%0A` +
                    `📍 *MAPA:* https://www.google.com/maps?q=${getV('gps')}`;

        const url = tipo === 'WA' ? 
            `https://api.whatsapp.com/send?text=${msg}` : 
            `https://t.me/share/url?url=${msg}`;
        
        window.location.href = url;
    }

    document.getElementById('foto').onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
                const cv = document.createElement('canvas');
                cv.width = 600; cv.height = 600;
                cv.getContext('2d').drawImage(img, 0, 0, 600, 600);
                fotoBase64 = cv.toDataURL('image/jpeg', 0.8);
                document.getElementById('preview').src = fotoBase64;
            };
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    function excluir() {
        if(confirm("DESEJA EXCLUIR?")) {
            let lista = JSON.parse(localStorage.getItem(DB_NAME));
            lista.splice(editIndex, 1);
            localStorage.setItem(DB_NAME, JSON.stringify(lista));
            window.location.href = "index.html";
        }
    }
</script>
</body>
</html>
