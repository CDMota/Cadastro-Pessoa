<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista - CDMota</title>
    <style>
        :root { --cor-primaria: #007bff; }
        .assinatura { position: absolute; top: 5px; left: 10px; font-size: 9px; color: #bbb; font-family: sans-serif; }
        body { font-family: sans-serif; background: #f0f2f5; padding: 15px; margin: 0; text-transform: uppercase; }
        .topo { max-width: 600px; margin: 20px auto 15px auto; }
        .busca-container { display: flex; gap: 10px; margin-top: 10px; }
        input#busca { flex: 1; padding: 12px; border-radius: 8px; border: 2px solid var(--cor-primaria); text-transform: uppercase; }
        .btn-novo { background: var(--cor-primaria); color: white; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        
        .tabela-container { background: white; border-radius: 15px; overflow: hidden; max-width: 600px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px; border-top: 1px solid #eee; vertical-align: middle; }
        
        /* FOTO QUADRADA NA LISTA */
        .foto-mini { 
            width: 65px; 
            height: 65px; 
            border-radius: 10px; 
            object-fit: cover; 
            background: #eee; 
            margin-right: 12px; 
            border: 2px solid var(--cor-primaria); 
            display: block;
        }
        
        .info-nome { display: flex; align-items: center; }
        .info-nome strong { color: #333; font-size: 14px; display: block; }
        .info-nome small { color: #888; font-size: 11px; }
        .btn-ver { background: #28a745; color: white; padding: 10px 15px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
<div class="assinatura">by CDMota</div>
<div class="topo">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin:0; color:var(--cor-primaria);">CADASTROS</h2>
        <a href="cadastro.html" class="btn-novo">+ NOVO</a>
    </div>
    <div class="busca-container">
        <input type="text" id="busca" placeholder="PESQUISAR..." onkeyup="filtrar()">
    </div>
</div>
<div class="tabela-container">
    <table>
        <tbody id="corpoTabela"></tbody>
    </table>
    <div id="msg" style="display:none; padding:20px; text-align:center; color:#999;">NADA ENCONTRADO</div>
</div>
<script>
    function carregar() {
        const corpo = document.getElementById('corpoTabela');
        const lista = JSON.parse(localStorage.getItem('banco_final') || '[]');
        corpo.innerHTML = "";
        lista.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="info-nome">
                    <img src="${item.foto || 'https://via.placeholder.com/65'}" class="foto-mini">
                    <div>
                        <strong>${item.nome}</strong>
                        <small>${item.apelido ? '"' + item.apelido + '"' : ''}</small>
                        <small style="display:block; color:var(--cor-primaria)">${item.cpf}</small>
                    </div>
                </td>
                <td style="text-align: right;"><a href="cadastro.html?edit=${index}" class="btn-ver">VER</a></td>
            `;
            corpo.appendChild(tr);
        });
    }
    function filtrar() {
        const val = document.getElementById('busca').value.toUpperCase();
        const linhas = document.querySelectorAll('#corpoTabela tr');
        linhas.forEach(tr => {
            tr.style.display = tr.innerText.toUpperCase().includes(val) ? "" : "none";
        });
    }
    window.onload = carregar;
</script>
</body>
</html>
