<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FICHA OPERACIONAL</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: #ddd; padding: 10px; text-transform: uppercase; }
        .caixa { background: #151515; padding: 15px; border-radius: 10px; max-width: 500px; margin: auto; border: 1px solid #333; }
        label { display: block; margin-top: 10px; font-size: 10px; color: #888; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 5px; background: #222; color: white; font-size: 14px; text-transform: uppercase; box-sizing: border-box; }
        .duas-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        #preview { width: 150px; height: 150px; border-radius: 8px; object-fit: cover; display: block; margin: 0 auto 10px; border: 2px solid #d32f2f; background: #222; }
        .btn { border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; margin-top: 10px; cursor: pointer; text-align: center; color: white; text-decoration: none; display: block; font-size: 12px; }
        .btn-salvar { background: #2e7d32; }
        .btn-whats { background: #25d366; color: black; }
        .btn-tele { background: #0088cc; }
        .btn-gps { background: #6a1b9a; width: 60px; }
        .btn-del { background: #b71c1c; margin-top: 20px; }
    </style>
</head>
<body>

<div class="caixa">
    <img id="preview" src="">
    <input type="file" id="foto" accept="image/*">

    <form id="formFinal">
        <label>NOME COMPLETO</label>
        <input type="text" id="nome" required>
        
        <label>NOME DA MÃE</label>
        <input type="text" id="mae">

        <div class="duas-col">
            <div><label>VULGO</label><input type="text" id="vulgo"></div>
            <div><label>CPF</label><input type="tel" id="cpf"></div>
        </div>

        <div class="duas-col">
            <div><label>NASCIMENTO</label><input type="tel" id="dataNasc"></div>
            <div><label>SEXO</label>
                <select id="sexo">
                    <option value="MASCULINO">MASCULINO</option>
                    <option value="FEMININO">FEMININO</option>
                </select>
            </div>
        </div>

        <label>NATUREZA</label>
        <select id="natureza" onchange="verificarAbordado()">
            <option value="">SELECIONE...</option>
            <option value="ABORDADO">ABORDADO</option>
            <option value="PRISÃO">PRISÃO</option>
        </select>

        <div class="duas-col">
            <div><label>DATA/HORA</label><input type="text" id="dataOcorrencia"></div>
            <div><label>STATUS</label>
                <select id="status">
                    <option value="ABORDADO">ABORDADO</option>
                    <option value="PRESO">PRESO</option>
                    <option value="FORAGIDO">FORAGIDO</option>
                    <option value="TORNOZELEIRA">TORNOZELEIRA</option>
                    <option value="FALECIDO">FALECIDO</option>
                </select>
            </div>
        </div>

        <label>GPS</label>
        <div style="display:flex; gap:5px;">
            <input type="text" id="gps" readonly>
            <button type="button" class="btn-gps" onclick="pegarGPS()">📍</button>
        </div>

        <label>ENDEREÇO (RUA/Nº/BAIRRO/CIDADE)</label>
        <textarea id="enderecoCompleto" rows="2"></textarea>

        <label>BO Nº / OBSERVAÇÕES</label>
        <textarea id="obs" rows="3"></textarea>

        <button type="submit" class="btn btn-salvar">💾 SALVAR E BAIXAR FOTO</button>
        
        <div id="areaAcao" style="display:none;">
            <button type="button" class="btn btn-whats" onclick="enviar('WA')">🟢 WHATSAPP COMPLETO</button>
            <button type="button" class="btn btn-tele" onclick="enviar('TG')">🔵 TELEGRAM COMPLETO</button>
            <button type="button" class="btn btn-del" onclick="excluir()">🗑️ EXCLUIR</button>
        </div>
        
        <a href="index.html" class="btn" style="background:#444;">VOLTAR</a>
    </form>
</div>

<script>
    const CHAVE = 'SISTEMA_V7_FINAL';
    const params = new URLSearchParams(window.location.search);
    const id = params.get('edit');
    let fotoBase64 = "";

    function verificarAbordado() {
        if(document.getElementById('natureza').value === "ABORDADO") {
            document.getElementById('dataOcorrencia').value = new Date().toLocaleString('pt-BR').toUpperCase();
        }
    }

    function pegarGPS() {
        navigator.geolocation.getCurrentPosition(pos => {
            document.getElementById('gps').value = `${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`;
        });
    }

    window.onload = () => {
        if (id !== null) {
            const lista = JSON.parse(localStorage.getItem(CHAVE) || '[]');
            const p = lista[id];
            if (p) {
                document.getElementById('areaAcao').style.display = "block";
                Object.keys(p).forEach(key => {
                    const el = document.getElementById(key);
                    if (el) el.value = p[key];
                });
                if (p.foto) {
                    document.getElementById('preview').src = p.foto;
                    fotoBase64 = p.foto;
                }
            }
        }
    };

    document.getElementById('formFinal').onsubmit = e => {
        e.preventDefault();
        let lista = JSON.parse(localStorage.getItem(CHAVE) || '[]');
        const dados = {};
        document.querySelectorAll('input, select, textarea').forEach(i => {
            if(i.id) dados[i.id] = i.value.toUpperCase();
        });
        dados.foto = fotoBase64;

        if (id !== null) lista[id] = dados; else lista.push(dados);
        localStorage.setItem(CHAVE, JSON.stringify(lista));

        // --- SALVAR NA GALERIA (DOWNLOAD) ---
        if(fotoBase64) {
            const link = document.createElement('a');
            link.href = fotoBase64;
            link.download = `FOTO_${dados.nome}.jpg`;
            link.click();
        }

        alert("DADOS SALVOS E FOTO ENVIADA PARA GALERIA!");
        window.location.href = "index.html";
    };

    function enviar(tipo) {
        const d = (id) => document.getElementById(id).value;
        const msg = `*RELATÓRIO OPERACIONAL*\n` +
                    `*NOME:* ${d('nome')}\n` +
                    `*VULGO:* ${d('vulgo')}\n` +
                    `*MÃE:* ${d('mae')}\n` +
                    `*CPF:* ${d('cpf')}\n` +
                    `*NASC:* ${d('dataNasc')}\n` +
                    `*STATUS:* ${d('status')}\n` +
                    `*NATUREZA:* ${d('natureza')}\n` +
                    `*DATA/HORA:* ${d('dataOcorrencia')}\n` +
                    `*END:* ${d('enderecoCompleto')}\n` +
                    `*OBS:* ${d('obs')}\n` +
                    `*MAPA:* http://maps.google.com/maps?q=${d('gps')}`;

        const url = tipo === 'WA' 
            ? `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`
            : `https://t.me/share/url?url=${encodeURIComponent(msg)}`;
        window.location.href = url;
    }

    document.getElementById('foto').onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
                const cv = document.createElement('canvas');
                cv.width = 500; cv.height = 500;
                cv.getContext('2d').drawImage(img, 0, 0, 500, 500);
                fotoBase64 = cv.toDataURL('image/jpeg', 0.9);
                document.getElementById('preview').src = fotoBase64;
            };
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    function excluir() {
        if(confirm("EXCLUIR REGISTRO?")) {
            let lista = JSON.parse(localStorage.getItem(CHAVE));
            lista.splice(id, 1);
            localStorage.setItem(CHAVE, JSON.stringify(lista));
            window.location.href = "index.html";
        }
    }
</script>
</body>
</html>
