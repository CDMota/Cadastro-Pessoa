<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Operacional</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; padding: 15px; margin: 0; }
        .topo { background: #0d47a1; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        #busca { width: 100%; padding: 12px; border: none; border-radius: 8px; margin-bottom: 15px; font-size: 16px; }
        .cartao { background: #2c2c2c; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; border-left: 6px solid #ffeb3b; }
        .foto { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; margin-right: 15px; border: 2px solid #555; }
        .info { flex-grow: 1; }
        .info h4 { margin: 0; color: #ffeb3b; text-transform: uppercase; font-size: 14px; }
        .info p { margin: 2px 0; font-size: 12px; color: #bbb; }
        .status-tag { font-size: 10px; padding: 3px 8px; border-radius: 10px; background: #444; color: #fff; font-weight: bold; }
        .btn-ver { background: #ffeb3b; color: #000; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>
    <div class="topo">
        <h3 style="margin:0">SISTEMA TÁTICO</h3>
        <a href="cadastro.html" style="background:#4caf50; color:white; padding:8px 15px; border-radius:5px; text-decoration:none; font-weight:bold;">+ NOVO</a>
    </div>
    <input type="text" id="busca" placeholder="🔍 Buscar por Nome, Vulgo ou CPF..." onkeyup="filtrar()">
    <div id="listaContainer"></div>

    <script>
        function carregar() {
            const lista = JSON.parse(localStorage.getItem('banco_operacional') || '[]');
            const container = document.getElementById('listaContainer');
            container.innerHTML = "";

            lista.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'cartao';
                // Cor do alerta baseada na periculosidade
                if(p.perigo === 'Alta') item.style.borderLeftColor = '#f44336';
                
                item.innerHTML = `
                    <img src="${p.foto || 'https://via.placeholder.com/100'}" class="foto">
                    <div class="info">
                        <h4>${p.nome} ${p.vulgo ? `(${p.vulgo})` : ''}</h4>
                        <p><b>Status:</b> <span class="status-tag">${p.status}</span></p>
                        <p><b>BO:</b> ${p.bo || 'N/A'}</p>
                    </div>
                    <a href="cadastro.html?edit=${index}" class="btn-ver">DETALHES</a>
                `;
                container.appendChild(item);
            });
        }
        function filtrar() {
            let termo = document.getElementById('busca').value.toLowerCase();
            let cartoes = document.getElementsByClassName('cartao');
            for (let c of cartoes) {
                c.style.display = c.innerText.toLowerCase().includes(termo) ? "flex" : "none";
            }
        }
        window.onload = carregar;
    </script>
</body>
</html>
