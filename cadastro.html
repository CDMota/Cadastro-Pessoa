<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FICHA OPERACIONAL</title>
    <style>
        :root { --cor-destaque: #d32f2f; --cor-natureza: #ffc107; }
        body { font-family: sans-serif; background: #0a0a0a; color: #ddd; padding: 10px; text-transform: uppercase; }
        .caixa { background: #151515; padding: 15px; border-radius: 10px; max-width: 500px; margin: auto; border: 1px solid #333; }
        label { display: block; margin-top: 10px; font-size: 10px; color: #888; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 5px; background: #222; color: white; font-size: 14px; text-transform: uppercase; box-sizing: border-box; }
        .cor-especial { border: 2px solid var(--cor-natureza) !important; color: var(--cor-natureza); font-weight: bold; }
        .duas-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        #preview { width: 150px; height: 150px; border-radius: 10px; object-fit: cover; display: block; margin: 0 auto 10px; border: 3px solid var(--cor-destaque); background: #222; }
        .btn { border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; margin-top: 10px; cursor: pointer; text-align: center; color: white; text-decoration: none; display: block; }
        .btn-salvar { background: #2e7d32; }
        .btn-whats { background: #25d366; color: black; }
        .btn-tele { background: #0088cc; }
        .btn-gps { background: #6a1b9a; width: 50px; }
        .btn-del { background: #b71c1c; margin-top: 20px; }
    </style>
</head>
<body>

<div class="caixa">
    <img id="preview" src="https://via.placeholder.com/150?text=FOTO">
    <input type="file" id="foto" accept="image/*" capture="environment" style="font-size:10px; margin-bottom:10px;">

    <form id="formFinal">
        <label>NOME COMPLETO</label><input type="text" id="nome" required>
        <div class="duas-col">
            <div><label>VULGO</label><input type="text" id="vulgo"></div>
            <div><label>CPF</label><input type="text" id="cpf"></div>
        </div>
        <div class="duas-col">
            <div><label>NATUREZA</label>
                <select id="natureza" class="cor-especial">
                    <option value="">SELECIONE...</option>
                    <option value="ABORDADO">ABORDADO</option>
                    <option value="PRISÃO">PRISÃO</option>
                    <option value="AVERIGUAÇÃO">AVERIGUAÇÃO</option>
                </select>
            </div>
            <div><label>DATA/HORA</label><input type="text" id="dataOcorrencia" class="cor-especial"></div>
        </div>
        <div class="duas-col">
            <div><label>STATUS</label>
                <select id="status">
                    <option value="ABORDADO">ABORDADO</option>
                    <option value="PRESO">PRESO</option>
                    <option value="FORAGIDO">FORAGIDO</option>
                </select>
            </div>
            <div><label>GPS</label>
                <div style="display:flex; gap:5px;"><input type="text" id="gps" readonly><button type="button" class="btn-gps" onclick="pegarGPS()">📍</button></div>
            </div>
        </div>
        <label>OBSERVAÇÕES</label><textarea id="obs" rows="3"></textarea>
        <button type="submit" class="btn btn-salvar">💾 SALVAR REGISTRO</button>
        <div id="areaApps" style="display:none;">
            <button type="button" class="btn btn-whats" onclick="compartilhar('WA')">🟢 WHATSAPP</button>
            <button type="button" class="btn btn-tele" onclick="compartilhar('TG')">🔵 TELEGRAM</button>
            <button type="button" class="btn btn-del" onclick="excluir()">🗑️ EXCLUIR</button>
        </div>
        <a href="index.html" class="btn" style="background:#333;">⬅️ VOLTAR</a>
    </form>
</div>

<script>
    const DB_NAME = 'SISTEMA_TATICO_ESTAVEL';
    const params = new URLSearchParams(window.location.search);
    const idEdicao = params.get('edit');
    let fotoBase64 = "";

    // CORREÇÃO: Carregar dados assim que abrir
    window.onload = function() {
        if (idEdicao !== null && idEdicao !== undefined) {
            const lista = JSON.parse(localStorage.getItem(DB_NAME) || '[]');
            const p = lista[idEdicao];
            if (p) {
                // Preenche cada campo usando o ID
                Object.keys(p).forEach(key => {
                    const el = document.getElementById(key);
                    if (el) el.value = p[key];
                });
                // Carrega a foto no preview
                if (p.foto) { 
                    document.getElementById('preview').src = p.foto; 
                    fotoBase64 = p.foto; 
                }
                document.getElementById('areaApps').style.display = 'block';
            }
        }
    };

    // Preenche data automaticamente ao escolher natureza
    document.getElementById('natureza').onchange = function() {
        if(this.value !== "") { 
            document.getElementById('dataOcorrencia').value = new Date().toLocaleString('pt-BR').toUpperCase(); 
        }
    };

    // Processa a foto
    document.getElementById('foto').onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
                const cv = document.createElement('canvas');
                cv.width = 450; cv.height = 450;
                cv.getContext('2d').drawImage(img, 0, 0, 450, 450);
                fotoBase64 = cv.toDataURL('image/jpeg', 0.8);
                document.getElementById('preview').src = fotoBase64;
            };
        };
        if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    };

    function pegarGPS() {
        navigator.geolocation.getCurrentPosition(pos => {
            document.getElementById('gps').value = `${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`;
        });
    }

    // Salvar ou Atualizar
    document.getElementById('formFinal').onsubmit = e => {
        e.preventDefault();
        let lista = JSON.parse(localStorage.getItem(DB_NAME) || '[]');
        const dados = {};
        document.querySelectorAll('input, select, textarea').forEach(i => { 
            if(i.id) dados[i.id] = i.value.toUpperCase(); 
        });
        dados.foto = fotoBase64;
        if (idEdicao !== null) lista[idEdicao] = dados; else lista.push(dados);
        localStorage.setItem(DB_NAME, JSON.stringify(lista));
        alert("REGISTRO SALVO!"); window.location.href = "index.html";
    };

    function compartilhar(tipo) {
        const v = (id) => document.getElementById(id).value.toUpperCase() || "---";
        const msg = `📌 *RELATÓRIO*%0A👤 *NOME:* ${v('nome')}%0A🎭 *VULGO:* ${v('vulgo')}%0A🛡️ *STATUS:* ${v('status')}%0A📍 *GPS:* ${v('gps')}`;
        const url = tipo === 'WA' ? `https://api.whatsapp.com/send?text=${msg}` : `https://t.me/share/url?url=${msg}`;
        window.location.href = url;
    }

    function excluir() {
        if(confirm("EXCLUIR REGISTRO?")) {
            let lista = JSON.parse(localStorage.getItem(DB_NAME));
            lista.splice(idEdicao, 1);
            localStorage.setItem(DB_NAME, JSON.stringify(lista));
            window.location.href = "index.html";
        }
    }
</script>
</body>
</html>
