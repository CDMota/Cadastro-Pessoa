<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FICHA OPERACIONAL V2</title>
    <style>
        :root { --cor-destaque: #d32f2f; --cor-natureza-data: #ffc107; }
        body { font-family: sans-serif; background: #0a0a0a; color: #ddd; padding: 10px; text-transform: uppercase; }
        .caixa { background: #151515; padding: 15px; border-radius: 10px; max-width: 500px; margin: auto; border: 1px solid #333; }
        label { display: block; margin-top: 10px; font-size: 10px; color: #888; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 5px; background: #222; color: white; font-size: 14px; text-transform: uppercase; box-sizing: border-box; }
        .cor-especial { border: 1px solid var(--cor-natureza-data); color: var(--cor-natureza-data); font-weight: bold; }
        .duas-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .quatro-col { display: grid; grid-template-columns: 2.5fr 1fr; gap: 8px; }
        #preview { width: 160px; height: 160px; border-radius: 8px; object-fit: cover; display: block; margin: 0 auto 10px; border: 3px solid var(--cor-destaque); background: #222; }
        .btn { border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; margin-top: 10px; cursor: pointer; text-align: center; color: white; text-decoration: none; display: block; }
        .btn-salvar { background: #2e7d32; }
        .btn-whats { background: #25d366; color: black; }
        .btn-tele { background: #0088cc; }
        .btn-gps { background: #6a1b9a; width: 50px; }
        .btn-del { background: #b71c1c; margin-top: 30px; }
    </style>
</head>
<body>

<div class="caixa">
    <img id="preview" src="https://via.placeholder.com/160?text=FOTO">
    <input type="file" id="foto" accept="image/*" capture="environment">

    <form id="formFinal">
        <label>NOME COMPLETO</label>
        <input type="text" id="nome" required>
        
        <div class="duas-col">
            <div><label>VULGO</label><input type="text" id="vulgo"></div>
            <div><label>CPF / DOC</label><input type="text" id="cpf"></div>
        </div>

        <div class="duas-col">
            <div><label>NASCIMENTO</label><input type="tel" id="dataNasc" placeholder="00/00/0000" maxlength="10"></div>
            <div><label>SEXO</label>
                <select id="sexo">
                    <option value="MASCULINO">MASCULINO</option>
                    <option value="FEMININO">FEMININO</option>
                </select>
            </div>
        </div>

        <div class="duas-col">
            <div>
                <label>NATUREZA</label>
                <select id="natureza" class="cor-especial" id="naturezaSelect">
                    <option value="">SELECIONE...</option>
                    <option value="ABORDADO">ABORDADO</option>
                    <option value="PRISÃO">PRISÃO</option>
                    <option value="AVERIGUAÇÃO">AVERIGUAÇÃO</option>
                </select>
            </div>
            <div>
                <label>DATA/HORA</label>
                <input type="text" id="dataOcorrencia" class="cor-especial">
            </div>
        </div>

        <label>ENDEREÇO E NÚMERO</label>
        <div class="quatro-col">
            <input type="text" id="rua" placeholder="RUA">
            <input type="text" id="numero" placeholder="Nº">
        </div>

        <div class="duas-col">
            <div><label>CIDADE</label><input type="text" id="cidade"></div>
            <div><label>ESTADO (UF)</label>
                <select id="uf">
                    <option value="PR" selected>PR</option>
                    <option value="SP">SP</option><option value="SC">SC</option><option value="RS">RS</option>
                </select>
            </div>
        </div>

        <div class="duas-col">
            <div><label>STATUS</label>
                <select id="status">
                    <option value="ABORDADO">ABORDADO</option>
                    <option value="PRESO">PRESO</option>
                </select>
            </div>
            <div><label>Nº DO B.O.</label><input type="text" id="bo"></div>
        </div>

        <label>GPS (COORDENADAS)</label>
        <div style="display:flex; gap:5px;">
            <input type="text" id="gps" readonly>
            <button type="button" class="btn-gps" onclick="pegarGPS()">📍</button>
        </div>

        <label>OBSERVAÇÕES</label>
        <textarea id="obs" rows="3"></textarea>

        <button type="submit" class="btn btn-salvar">💾 SALVAR NO SISTEMA</button>
        
        <div id="areaApps" style="display:none; margin-top:20px;">
            <button type="button" class="btn btn-whats" onclick="enviarApp('WA')">🟢 WHATSAPP</button>
            <button type="button" class="btn btn-tele" onclick="enviarApp('TG')">🔵 TELEGRAM</button>
            <button type="button" class="btn btn-del" onclick="excluirRegistro()">🗑️ EXCLUIR</button>
        </div>
        
        <a href="index.html" class="btn" style="background:#333;">⬅️ VOLTAR</a>
    </form>
</div>

<script>
    const DB_NAME = 'SISTEMA_TATICO_ESTAVEL';
    const params = new URLSearchParams(window.location.search);
    const idEdicao = params.get('edit');
    let fotoBase64 = "";

    // CORREÇÃO: Puxar data e hora ao mudar natureza
    document.getElementById('natureza').addEventListener('change', function() {
        if(this.value !== "") {
            const agora = new Date();
            document.getElementById('dataOcorrencia').value = agora.toLocaleString('pt-BR').toUpperCase();
        }
    });

    // CORREÇÃO: Preview da Foto
    document.getElementById('foto').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 500; canvas.height = 500;
                ctx.drawImage(img, 0, 0, 500, 500);
                fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
                document.getElementById('preview').src = fotoBase64;
            }
        }
        if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    });

    function pegarGPS() {
        navigator.geolocation.getCurrentPosition(pos => {
            document.getElementById('gps').value = `${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`;
        });
    }

    // Carregar dados existentes
    window.onload = () => {
        if (idEdicao !== null) {
            const lista = JSON.parse(localStorage.getItem(DB_NAME) || '[]');
            const p = lista[idEdicao];
            if (p) {
                Object.keys(p).forEach(key => {
                    const el = document.getElementById(key);
                    if (el) el.value = p[key];
                });
                if (p.foto) {
                    document.getElementById('preview').src = p.foto;
                    fotoBase64 = p.foto;
                }
                document.getElementById('areaApps').style.display = 'block';
            }
        }
    };

    // CORREÇÃO: Salvar os dados
    document.getElementById('formFinal').onsubmit = function(e) {
        e.preventDefault();
        let lista = JSON.parse(localStorage.getItem(DB_NAME) || '[]');
        const dados = {};
        
        document.querySelectorAll('input, select, textarea').forEach(i => {
            if(i.id) dados[i.id] = i.value.toUpperCase();
        });
        dados.foto = fotoBase64;

        if (idEdicao !== null) lista[idEdicao] = dados;
        else lista.push(dados);

        localStorage.setItem(DB_NAME, JSON.stringify(lista));
        alert("✅ SALVO COM SUCESSO!");
        window.location.href = "index.html"; // Volta para a lista para ver o novo item
    };

    function enviarApp(tipo) {
        const v = (id) => document.getElementById(id).value.toUpperCase() || "---";
        const msg = `📌 *RELATÓRIO*%0A👤 *NOME:* ${v('nome')}%0A⚖️ *NAT:* ${v('natureza')}%0A🕒 *DATA:* ${v('dataOcorrencia')}%0A📍 *GPS:* ${v('gps')}`;
        window.location.href = tipo === 'WA' ? `https://api.whatsapp.com/send?text=${msg}` : `https://t.me/share/url?url=${msg}`;
    }

    function excluirRegistro() {
        if(confirm("EXCLUIR?")) {
            let lista = JSON.parse(localStorage.getItem(DB_NAME));
            lista.splice(idEdicao, 1);
            localStorage.setItem(DB_NAME, JSON.stringify(lista));
            window.location.href = "index.html";
        }
    }
</script>
</body>
</html>
