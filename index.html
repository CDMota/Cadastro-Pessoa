<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA TÁTICO - LISTA</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: white; padding: 15px; margin: 0; }
        .topo { background: #1a1a1a; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #d32f2f; }
        #busca { width: 100%; padding: 15px; border: none; border-radius: 8px; margin: 15px 0; font-size: 16px; background: #222; color: white; text-transform: uppercase; box-sizing: border-box; border: 1px solid #333; }
        .cartao { background: #1a1a1a; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; border-left: 5px solid #d32f2f; }
        .foto-lista { width: 60px; height: 60px; border-radius: 5px; object-fit: cover; margin-right: 15px; border: 1px solid #333; background: #333; }
        .info { flex-grow: 1; }
        .info h4 { margin: 0; color: #fff; text-transform: uppercase; font-size: 14px; }
        .info p { margin: 2px 0; font-size: 11px; color: #aaa; text-transform: uppercase; }
        .btn-ver { background: #d32f2f; color: white; padding: 10px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>
    <div class="topo">
        <h3 style="margin:0">SISTEMA TÁTICO</h3>
        <a href="cadastro.html" style="background:#2e7d32; color:white; padding:10px 15px; border-radius:5px; text-decoration:none; font-weight:bold;">+ NOVO</a>
    </div>
    
    <input type="text" id="busca" placeholder="🔍 BUSCAR NOME OU VULGO..." oninput="filtrar()">
    <div id="listaContainer"></div>

    <script>
        const DB_NAME = 'SISTEMA_TATICO_ESTAVEL';

        function carregar() {
            const container = document.getElementById('listaContainer');
            const lista = JSON.parse(localStorage.getItem(DB_NAME) || '[]');
            container.innerHTML = lista.length === 0 ? '<div style="text-align:center;color:#666;margin-top:50px;">NENHUM REGISTRO</div>' : "";

            lista.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'cartao';
                item.innerHTML = `
                    <img src="${p.foto || ''}" class="foto-lista">
                    <div class="info">
                        <h4>${p.nome || 'SEM NOME'}</h4>
                        <p>VULGO: ${p.vulgo || 'N/I'} | STATUS: ${p.status || 'N/I'}</p>
                    </div>
                    <a href="cadastro.html?edit=${index}" class="btn-ver">ABRIR</a>
                `;
                container.appendChild(item);
            });
        }

        function filtrar() {
            const termo = document.getElementById('busca').value.toUpperCase();
            const cards = document.getElementsByClassName('cartao');
            for (let c of cards) {
                c.style.display = c.innerText.toUpperCase().includes(termo) ? "flex" : "none";
            }
        }
        window.onload = carregar;
    </script>
</body>
</html>
