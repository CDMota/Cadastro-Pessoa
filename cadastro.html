<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - CDMota</title>
    <style>
        :root { --cor-primaria: #007bff; --cor-sucesso: #25d366; --cor-telegram: #0088cc; --cor-alerta: #f39c12; --cor-perigo: #dc3545; }
        .assinatura { position: absolute; top: 5px; left: 10px; font-size: 9px; color: #bbb; font-family: sans-serif; text-transform: none; }
        
        body { font-family: sans-serif; background: #f0f2f5; padding: 15px; margin: 0; position: relative; text-transform: uppercase; }
        .caixa { background: white; padding: 20px; border-radius: 15px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 11px; color: #666; }
        input, textarea, select { width: 100%; padding: 12px 8px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; margin-top: 5px; text-transform: uppercase; }
        
        /* AJUSTE DE COLUNAS: CPF MENOR, DATA MAIOR */
        .linha-cpf-data { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 10px; }
        .duas-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tres-col { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
        
        /* DATA TRIPLA AJUSTADA */
        .data-tripla { display: grid; grid-template-columns: 1fr 1.1fr 1.4fr; gap: 4px; }
        .data-tripla select { padding: 12px 2px; font-size: 13px; text-align: center; }
        
        #preview { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; display: block; margin: 10px auto; border: 3px solid var(--cor-primaria); background: #eee; }
        
        .btn { border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; font-size: 14px; text-align: center; text-decoration: none; display: block; color: white; }
        .btn-salvar { background: var(--cor-primaria); }
        .btn-foto { background: var(--cor-alerta); display: none; }
        .btn-whats { background: var(--cor-sucesso); display: none; }
        .btn-tele { background: var(--cor-telegram); display: none; }
        .btn-del { background: var(--cor-perigo); display: none; margin-top: 30px; }
        .btn-voltar { text-align: center; margin-top: 15px; color: #666; text-decoration: none; display: block; font-size: 12px; }
        .secao-compartilhar { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ccc; }
    </style>
</head>
<body>

<div class="assinatura">by CDMota</div>

<div class="caixa">
    <h3 style="text-align:center; color:var(--cor-primaria); margin-top:0">FICHA DE DADOS</h3>
    <img id="preview" src="https://via.placeholder.com/120">
    
    <form id="formFinal">
        <label>FOTO (TIRAR OU GALERIA)</label>
        <input type="file" id="foto" accept="image/*" capture="environment">
        
        <div class="duas-col">
            <div><label>NOME COMPLETO</label><input type="text" id="nome" required oninput="this.value = this.value.toUpperCase()"></div>
            <div><label>APELIDO</label><input type="text" id="apelido" oninput="this.value = this.value.toUpperCase()"></div>
        </div>
        
        <div class="linha-cpf-data">
            <div><label>CPF</label><input type="tel" id="cpf" maxlength="14" required></div>
            <div>
                <label>NASCIMENTO</label>
                <div class="data-tripla">
                    <select id="dia"><option value="">DI</option></select>
                    <select id="mes">
                        <option value="">MÊS</option>
                        <option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
                    </select>
                    <select id="ano"><option value="">ANO</option></select>
                </div>
            </div>
        </div>

        <label>ENDEREÇO</label>
        <div class="tres-col">
            <input type="text" id="rua" placeholder="RUA" oninput="this.value = this.value.toUpperCase()">
            <input type="text" id="numero" placeholder="Nº">
            <select id="uf">
                <option value="">UF</option><option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option><option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option><option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option><option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option><option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option><option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option><option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option><option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option><option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
            </select>
        </div>
        <input type="text" id="cidade" placeholder="CIDADE" style="margin-top: 5px;" oninput="this.value = this.value.toUpperCase()">
        
        <label>OBSERVAÇÕES</label>
        <textarea id="obs" rows="2" oninput="this.value = this.value.toUpperCase()"></textarea>

        <button type="submit" id="btnAcao" class="btn btn-salvar">💾 SALVAR NO SISTEMA</button>
        
        <div class="secao-compartilhar">
            <button type="button" id="btnFoto" class="btn btn-foto" onclick="baixarFoto()">1º 📸 SALVAR FOTO</button>
            <button type="button" id="btnTele" class="btn btn-tele" onclick="compartilharApp('telegram')">2º 🔵 ENVIAR (TELEGRAM)</button>
            <button type="button" id="btnWhats" class="btn btn-whats" onclick="compartilharApp('whatsapp')">2º 🟢 ENVIAR (WHATSAPP)</button>
        </div>
        
        <button type="button" id="btnDel" class="btn btn-del" onclick="excluir()">🗑️ APAGAR</button>
        <a href="index.html" class="btn-voltar">⬅️ VOLTAR</a>
    </form>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('edit');
    let fotoBase64 = "";

    const selDia = document.getElementById('dia');
    for(let i=1; i<=31; i++) {
        let opt = document.createElement('option');
        opt.value = i.toString().padStart(2,'0'); opt.text = opt.value;
        selDia.add(opt);
    }

    const selAno = document.getElementById('ano');
    const anoAtual = new Date().getFullYear();
    for(let i = anoAtual; i >= 1920; i--) {
        let opt = document.createElement('option');
        opt.value = i; opt.text = i;
        selAno.add(opt);
    }

    document.getElementById('cpf').oninput = e => {
        let v = e.target.value.replace(/\D/g, '');
        v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        e.target.value = v;
    };

    window.onload = () => {
        if (id !== null) {
            const lista = JSON.parse(localStorage.getItem('banco_final') || '[]');
            const d = lista[id];
            if (d) {
                document.getElementById('btnFoto').style.display = "block";
                document.getElementById('btnTele').style.display = "block";
                document.getElementById('btnWhats').style.display = "block";
                document.getElementById('btnDel').style.display = "block";
                document.getElementById('nome').value = d.nome || '';
                document.getElementById('apelido').value = d.apelido || '';
                document.getElementById('cpf').value = d.cpf || '';
                document.getElementById('rua').value = d.rua || '';
                document.getElementById('numero').value = d.numero || '';
                document.getElementById('cidade').value = d.cidade || '';
                document.getElementById('uf').value = d.uf || '';
                document.getElementById('obs').value = d.obs || '';
                if(d.data && d.data.includes('/')) {
                    const partes = d.data.split('/');
                    document.getElementById('dia').value = partes[0];
                    document.getElementById('mes').value = partes[1];
                    document.getElementById('ano').value = partes[2];
                }
                if(d.foto) { document.getElementById('preview').src = d.foto; fotoBase64 = d.foto; }
            }
        }
    };

    function baixarFoto() {
        if (!fotoBase64) return;
        const link = document.createElement('a');
        link.href = fotoBase64;
        link.download = `FOTO_${document.getElementById('nome').value}.jpg`;
        link.click();
    }

    function compartilharApp(plataforma) {
        const n = document.getElementById('nome').value;
        const ape = document.getElementById('apelido').value || '---';
        const d = document.getElementById('dia').value;
        const m = document.getElementById('mes').value;
        const a = document.getElementById('ano').value;
        const dataF = (d && m && a) ? `${d}/${m}/${a}` : '---';

        const texto = `*FICHA DE CADASTRO*%0A%0A` +
                      `*NOME:* ${n}%0A` +
                      `*APELIDO:* ${ape}%0A` +
                      `*CPF:* ${document.getElementById('cpf').value}%0A` +
                      `*NASC:* ${dataF}%0A` +
                      `*END:* ${document.getElementById('rua').value}, ${document.getElementById('numero').value}%0A` +
                      `*CIDADE:* ${document.getElementById('cidade').value}-${document.getElementById('uf').value}%0A` +
                      `*OBS:* ${document.getElementById('obs').value}`;

        window.location.href = plataforma === 'whatsapp' ? `whatsapp://send?text=${texto}` : `tg://msg?text=${texto}`;
    }

    document.getElementById('foto').onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
                const cv = document.createElement('canvas');
                cv.width = 500; cv.height = 500;
                cv.getContext('2d').drawImage(img, 0, 0, 500, 500);
                fotoBase64 = cv.toDataURL('image/jpeg', 0.8);
                document.getElementById('preview').src = fotoBase64;
            };
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    document.getElementById('formFinal').onsubmit = e => {
        e.preventDefault();
        let lista = JSON.parse(localStorage.getItem('banco_final') || '[]');
        const dataFinal = document.getElementById('dia').value + '/' + document.getElementById('mes').value + '/' + document.getElementById('ano').value;
        const dados = {
            nome: document.getElementById('nome').value,
            apelido: document.getElementById('apelido').value,
            cpf: document.getElementById('cpf').value,
            data: dataFinal,
            rua: document.getElementById('rua').value,
            numero: document.getElementById('numero').value,
            cidade: document.getElementById('cidade').value,
            uf: document.getElementById('uf').value,
            obs: document.getElementById('obs').value,
            foto: fotoBase64
        };
        if (id !== null) lista[id] = dados;
        else lista.push(dados);
        localStorage.setItem('banco_final', JSON.stringify(lista));
        alert("CADASTRO SALVO!");
        window.location.href = "index.html";
    };

    function excluir() {
        if(confirm("EXCLUIR REGISTRO?")) {
            let lista = JSON.parse(localStorage.getItem('banco_final'));
            lista.splice(id, 1);
            localStorage.setItem('banco_final', JSON.stringify(lista));
            window.location.href = "index.html";
        }
    }
</script>
</body>
</html>
