<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO OPERACIONAL</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: #ddd; padding: 10px; text-transform: uppercase; }
        .caixa { background: #151515; padding: 15px; border-radius: 10px; max-width: 500px; margin: auto; border: 1px solid #333; }
        label { display: block; margin-top: 10px; font-size: 10px; color: #888; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 5px; background: #222; color: white; font-size: 14px; text-transform: uppercase; box-sizing: border-box; }
        .duas-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        #preview { width: 130px; height: 130px; border-radius: 5px; object-fit: cover; display: block; margin: 0 auto 10px; border: 2px solid #d32f2f; background: #222; }
        .btn { border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; margin-top: 10px; cursor: pointer; text-align: center; color: white; text-decoration: none; display: block; }
        .btn-salvar { background: #2e7d32; }
        .btn-whats { background: #25d366; }
        .btn-gps { background: #6a1b9a; width: 50px; }
        .btn-del { background: #b71c1c; }
    </style>
</head>
<body>

<div class="caixa">
    <img id="preview" src="">
    <input type="file" id="foto" accept="image/*" style="font-size:10px;">

    <form id="formFinal">
        <label>NOME COMPLETO</label>
        <input type="text" id="nome" required>
        
        <label>NOME DA MÃE</label>
        <input type="text" id="mae">

        <div class="duas-col">
            <div><label>VULGO</label><input type="text" id="vulgo"></div>
            <div><label>CPF</label><input type="tel" id="cpf" maxlength="14"></div>
        </div>

        <div class="duas-col">
            <div><label>DATA NASCIMENTO</label><input type="tel" id="dataNasc" maxlength="10" placeholder="00/00/0000"></div>
            <div><label>SEXO</label>
                <select id="sexo">
                    <option value="MASCULINO">MASCULINO</option>
                    <option value="FEMININO">FEMININO</option>
                </select>
            </div>
        </div>

        <label>NATUREZA DA OCORRÊNCIA</label>
        <select id="natureza" onchange="verificarNatureza()">
            <option value="">SELECIONE...</option>
            <option value="ABORDADO">ABORDADO</option>
            <option value="PRISÃO">PRISÃO</option>
            <option value="AVERIGUAÇÃO">AVERIGUAÇÃO</option>
        </select>

        <div class="duas-col">
            <div><label>DATA/HORA</label><input type="text" id="dataOcorrencia"></div>
            <div><label>STATUS</label>
                <select id="status">
                    <option value="ABORDADO">ABORDADO</option>
                    <option value="PRESO">PRESO</option>
                    <option value="FORAGIDO">FORAGIDO</option>
                    <option value="TORNOZELEIRA">TORNOZELEIRA</option>
                    <option value="FALECIDO">FALECIDO</option>
                </select>
            </div>
        </div>

        <label>LOCAL (GPS)</label>
        <div style="display:flex; gap:5px;">
            <input type="text" id="gps" readonly placeholder="COORDENADAS">
            <button type="button" class="btn-gps" onclick="pegarGPS()">📍</button>
        </div>

        <label>ENDEREÇO</label>
        <input type="text" id="rua" placeholder="RUA / NÚMERO">
        <div class="duas-col">
            <div><input type="text" id="bairro" placeholder="BAIRRO"></div>
            <div><input type="text" id="cidade" placeholder="CIDADE"></div>
        </div>

        <div class="duas-col">
            <div><label>FACÇÃO</label><input type="text" id="faccao"></div>
            <div><label>BO Nº</label><input type="text" id="bo"></div>
        </div>

        <label>OBSERVAÇÕES</label>
        <textarea id="obs" rows="3"></textarea>

        <button type="submit" class="btn btn-salvar">💾 SALVAR</button>
        <button type="button" id="btnZap" class="btn btn-whats" style="display:none;" onclick="compartilhar()">🟢 COMPARTILHAR DADOS</button>
        <button type="button" id="btnDel" class="btn btn-del" style="display:none;" onclick="excluir()">🗑️ EXCLUIR</button>
        <a href="index.html" class="btn" style="background:#444;">VOLTAR</a>
    </form>
</div>

<script>
    const DB_KEY = 'SISTEMA_TATICO_V4';
    const params = new URLSearchParams(window.location.search);
    const id = params.get('edit');
    let fotoBase64 = "";

    // Máscara Data Nasc
    document.getElementById('dataNasc').oninput = e => {
        let v = e.target.value.replace(/\D/g, '');
        v = v.replace(/(\d{2})(\d)/, '$1/$2').replace(/(\d{2})(\d)/, '$1/$2');
        e.target.value = v;
    };

    // Data automática APENAS se escolher ABORDADO
    function verificarNatureza() {
        const nat = document.getElementById('natureza').value;
        if (nat === "ABORDADO") {
            document.getElementById('dataOcorrencia').value = new Date().toLocaleString('pt-BR').toUpperCase();
        }
    }

    function pegarGPS() {
        navigator.geolocation.getCurrentPosition(pos => {
            document.getElementById('gps').value = `${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`;
        });
    }

    // CARREGAR DADOS AO CLICAR EM "VER"
    window.onload = () => {
        if (id !== null) {
            const lista = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
            const p = lista[id];
            if (p) {
                document.getElementById('btnZap').style.display = "block";
                document.getElementById('btnDel').style.display = "block";
                // Preenche campos
                Object.keys(p).forEach(key => {
                    const el = document.getElementById(key);
                    if (el) el.value = p[key];
                });
                if (p.foto) {
                    document.getElementById('preview').src = p.foto;
                    fotoBase64 = p.foto;
                }
            }
        }
    };

    document.getElementById('formFinal').onsubmit = e => {
        e.preventDefault();
        let lista = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
        const dados = {};
        document.querySelectorAll('input, select, textarea').forEach(i => {
            if(i.id) dados[i.id] = i.value.toUpperCase();
        });
        dados.foto = fotoBase64;

        if (id !== null) lista[id] = dados; else lista.push(dados);
        localStorage.setItem(DB_KEY, JSON.stringify(lista));
        alert("SALVO!");
        window.location.href = "index.html";
    };

    function compartilhar() {
        const txt = `*RELATÓRIO TÁTICO*\n*NOME:* ${document.getElementById('nome').value}\n*VULGO:* ${document.getElementById('vulgo').value}\n*MÃE:* ${document.getElementById('mae').value}\n*STATUS:* ${document.getElementById('status').value}\n*LOCAL:* https://www.google.com/maps?q=${document.getElementById('gps').value}`;
        window.location.href = "https://api.whatsapp.com/send?text=" + encodeURIComponent(txt);
    }

    document.getElementById('foto').onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
                const cv = document.createElement('canvas');
                cv.width = 400; cv.height = 400;
                cv.getContext('2d').drawImage(img, 0, 0, 400, 400);
                fotoBase64 = cv.toDataURL('image/jpeg', 0.7);
                document.getElementById('preview').src = fotoBase64;
            };
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    function excluir() {
        if(confirm("EXCLUIR REGISTRO?")) {
            let lista = JSON.parse(localStorage.getItem(DB_KEY));
            lista.splice(id, 1);
            localStorage.setItem(DB_KEY, JSON.stringify(lista));
            window.location.href = "index.html";
        }
    }
</script>
</body>
</html>
