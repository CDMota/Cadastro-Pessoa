<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO OPERACIONAL</title>
    <style>
        :root { --cor-destaque: #d32f2f; --cor-natureza: #ffc107; }
        body { font-family: sans-serif; background: #0a0a0a; color: #ddd; padding: 10px; text-transform: uppercase; }
        .caixa { background: #151515; padding: 15px; border-radius: 10px; max-width: 500px; margin: auto; border: 1px solid #333; }
        label { display: block; margin-top: 10px; font-size: 9px; color: #888; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 5px; background: #222; color: white; font-size: 13px; text-transform: uppercase; box-sizing: border-box; }
        .cor-especial { border: 1px solid var(--cor-natureza) !important; color: var(--cor-natureza); font-weight: bold; }
        .duas-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .tres-col { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
        #preview { width: 140px; height: 140px; border-radius: 8px; object-fit: cover; display: block; margin: 0 auto 10px; border: 3px solid var(--cor-destaque); background: #222; }
        .btn { border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; margin-top: 10px; cursor: pointer; text-align: center; color: white; text-decoration: none; display: block; }
        .btn-salvar { background: #2e7d32; font-size: 15px; }
        .btn-whats { background: #25d366; color: black; }
        .btn-tele { background: #0088cc; }
        .btn-gps { background: #6a1b9a; width: 50px; font-size: 20px; }
        .btn-del { background: #b71c1c; margin-top: 30px; font-size: 12px; }
    </style>
</head>
<body>

<div class="caixa">
    <img id="preview" src="https://via.placeholder.com/140?text=FOTO">
    <input type="file" id="foto" accept="image/*" style="font-size: 9px; margin-bottom: 10px;">

    <form id="formFinal">
        <label>NOME COMPLETO</label>
        <input type="text" id="nome" required>

        <label>NOME DA MÃE</label>
        <input type="text" id="mae">
        
        <div class="duas-col">
            <div><label>VULGO</label><input type="text" id="vulgo"></div>
            <div><label>CPF / DOC</label><input type="text" id="cpf"></div>
        </div>

        <div class="duas-col">
            <div><label>DATA NASC.</label><input type="text" id="nasc" placeholder="00/00/0000"></div>
            <div><label>NATUREZA</label>
                <select id="natureza" class="cor-especial">
                    <option value="">SELECIONE...</option>
		    <option value="AVERIGUAÇÃO">AVERIGUAÇÃO</option>
                    <option value="ABORDADO">ABORDADO</option>
                    <option value="PRISÃO">PRISÃO</option>
                    
                </select>
            </div>
        </div>

        <div class="duas-col">
            <div><label>DATA/HORA OCORR.</label><input type="text" id="dataOcorrencia" class="cor-especial"></div>
            <div><label>STATUS</label>
                <select id="status">
                    <option value="ABORDADO">ABORDADO</option>
                    <option value="PRESO">PRESO</option>
                    <option value="FORAGIDO">FORAGIDO</option>
                    <option value="TORNOZELEIRA">TORNOZELEIRA</option>
                    <option value="FALECIDO">FALECIDO</option>
                </select>
            </div>
        </div>

        <label>ENDEREÇO E NÚMERO</label>
        <input type="text" id="end" placeholder="RUA, Nº">

        <div class="tres-col">
            <div><label>CIDADE</label><input type="text" id="cidade"></div>
            <div><label>UF</label>
                <select id="uf">
                    <option value="PR">PR</option>
		    <option value="AC">AC</option>
		    <option value="AL">AL</option>
 		    <option value="AM">AM</option>
		    <option value="AP">AP</option>		    
	            <option value="BA">BA</option>
		    <option value="CE">CE</option>
		    <option value="DF">DF</option>
		    <option value="ES">ES</option>
		    <option value="GO">GO</option>
		    <option value="MA">MA</option>
		    <option value="MG">MG</option>
		    <option value="MS">MS</option>
		    <option value="MT">MT</option>
		    <option value="PA">PA</option>
		    <option value="PB">PB</option>
		    <option value="PE">PE</option>
		    <option value="PI">PI</option>
		    <option value="RJ">RJ</option>
		    <option value="RN">RN</option>
		    <option value="RO">RO</option>
		    <option value="RR">RR</option>
		    <option value="RS">RS</option>
		    <option value="SC">SC</option>
		    <option value="SE">SE</option>		    
                    <option value="SP">SP</option>
                    <option value="TO">TO</option>
		   
		
                </select>
            </div>
            <div><label>Nº B.O.</label><input type="text" id="bo"></div>

<label>MAPA (LINK GOOGLE MAPS)</label>
        <div style="display:flex; gap:5px;">
            <input type="text" id="gps" placeholder="GERAR LINK NO ÍCONE" readonly>
            <button type="button" class="btn-gps" onclick="pegarGPS()">📍</button>
        </div>

        <label>OBSERVAÇÕES</label>
        <textarea id="obs" rows="2"></textarea>

        <button type="submit" class="btn btn-salvar">💾 SALVAR E BAIXAR FOTO</button>
        
        <div id="areaApps" style="display:none; margin-top:20px; border-top: 1px dashed #444; padding-top: 10px;">
            <button type="button" class="btn btn-whats" onclick="enviarApp('WA')">🟢 COMPARTILHAR WHATSAPP</button>
            <button type="button" class="btn btn-tele" onclick="enviarApp('TG')">🔵 COMPARTILHAR TELEGRAM</button>
            <button type="button" class="btn btn-del" onclick="excluirRegistro()">🗑️ EXCLUIR REGISTRO</button>
        </div>
        
        <a href="index.html" class="btn" style="background:#333;">⬅️ VOLTAR PARA LISTA</a>
    </form>
</div>

<script>
    const DB_NAME = 'SISTEMA_TATICO_ESTAVEL';
    const params = new URLSearchParams(window.location.search);
    let idEdicao = params.get('edit');
    let fotoBase64 = "";

    window.onload = function() {
        if (idEdicao !== null && idEdicao !== "") {
            const lista = JSON.parse(localStorage.getItem(DB_NAME) || '[]');
            const p = lista[parseInt(idEdicao)];
            if (p) {
                const campos = ['nome', 'mae', 'vulgo', 'cpf', 'nasc', 'natureza', 'dataOcorrencia', 'status', 'end', 'cidade', 'uf', 'bo', 'gps', 'obs'];
                campos.forEach(id => {
                    const el = document.getElementById(id);
                    if (el && p[id] !== undefined) el.value = p[id];
                });
                if (p.foto) {
                    document.getElementById('preview').src = p.foto;
                    fotoBase64 = p.foto;
                }
                document.getElementById('areaApps').style.display = 'block';
            }
        }
    };

    document.getElementById('natureza').onchange = function() {
        if(this.value !== "") {
            document.getElementById('dataOcorrencia').value = new Date().toLocaleString('pt-BR').toUpperCase();
        }
    };

    document.getElementById('foto').onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
                const cv = document.createElement('canvas');
                cv.width = 600; cv.height = 600;
                cv.getContext('2d').drawImage(img, 0, 0, 600, 600);
                fotoBase64 = cv.toDataURL('image/jpeg', 0.9);
                document.getElementById('preview').src = fotoBase64;
            };
        };
        if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    };

    // FUNÇÃO DO MAPA CORRIGIDA PARA O SEU PADRÃO
    function pegarGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                // Formato de link direto para localização
                const linkMapa = https://www.google.com/maps?q=${lat},${lon};
                document.getElementById('gps').value = linkMapa;
            }, () => alert("ERRO: Ative a localização/GPS do celular."));
        } else {
            alert("Seu navegador não suporta GPS.");
        }
    }

    document.getElementById('formFinal').onsubmit = e => {
        e.preventDefault();
        let lista = JSON.parse(localStorage.getItem(DB_NAME) || '[]');
        const dados = {};
        
        // Coleta todos os campos transformando em MAIÚSCULO, exceto o GPS
        document.querySelectorAll('input, select, textarea').forEach(i => {
            if(i.id === 'gps') {
                dados[i.id] = i.value; // Mantém a URL do mapa intacta
            } else if(i.id) {
                dados[i.id] = i.value.toUpperCase();
            }
        });

        dados.foto = fotoBase64;

        if (fotoBase64) {
            const linkDownload = document.createElement('a');
            const nomeArquivo = (dados.nome + "_" + (dados.vulgo || "")).replace(/\s/g, "_");
            linkDownload.href = fotoBase64;
            linkDownload.download = nomeArquivo + ".jpg";
            linkDownload.click();
        }

        if (idEdicao !== null && idEdicao !== "") {
            lista[parseInt(idEdicao)] = dados;
        } else {
            lista.push(dados);
            idEdicao = lista.length - 1; // Atualiza o ID para o novo registro
        }

        localStorage.setItem(DB_NAME, JSON.stringify(lista));
        document.getElementById('areaApps').style.display = 'block'; // Mostra botões de compartilhamento
        alert("DADOS SALVOS E FOTO BAIXADA!");
        // Removido o redirecionamento para manter a página aberta
    };

    function enviarApp(tipo) {
        const v = (id) => document.getElementById(id).value || "---";

		// Montagem do texto com ícones apenas para o envio
        const texto = 
            `📌 *RELATÓRIO OPERACIONAL*%0A%0A` +
            `👤 *NOME:* ${v('nome').toUpperCase()}%0A` +
            `🎭 *VULGO:* ${v('vulgo').toUpperCase()}%0A` +
            `👩‍👦 *MÃE:* ${v('mae').toUpperCase()}%0A` +
            `💳 *DOC:* ${v('cpf').toUpperCase()}%0A` +
            `📅 *NASC:* ${v('nasc').toUpperCase()}%0A%0A` +
            `⚖️ *NATUREZA:* ${v('natureza').toUpperCase()}%0A` +
            `🕒 *DATA/HORA:* ${v('dataOcorrencia').toUpperCase()}%0A` +
            `🛡️ *STATUS:* ${v('status').toUpperCase()}%0A%0A` +
            `🏠 *END:* ${v('end').toUpperCase()}%0A` +
            `🏙️ *CIDADE:* ${v('cidade').toUpperCase()} - ${v('uf').toUpperCase()}%0A` +
            `📂 *B.O:* ${v('bo').toUpperCase()}%0A` +
            `📝 *OBS:* ${v('obs').toUpperCase()}%0A%0A` +
            `📍 *MAPA:* ${v('gps')}`;

        const url = tipo === 'WA' ? 
            `https://api.whatsapp.com/send?text=${texto}` : 
            `https://t.me/share/url?url=${texto}`;
        window.location.href = url;
    }

    function excluirRegistro() {
        if(confirm("EXCLUIR?")) {
            let lista = JSON.parse(localStorage.getItem(DB_NAME));
            lista.splice(parseInt(idEdicao), 1);
            localStorage.setItem(DB_NAME, JSON.stringify(lista));
            window.location.href = "index.html";
        }
    }
</script>
</body>
</html>
