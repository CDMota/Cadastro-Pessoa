<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
        .caixa { background: white; padding: 20px; border-radius: 15px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 11px; color: #666; text-transform: uppercase; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; margin-top: 5px; text-transform: uppercase; }
        .duas-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        #preview { width: 120px; height: 120px; border-radius: 10px; object-fit: cover; display: block; margin: 10px auto; border: 3px solid #007bff; background: #eee; }
        .btn { border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; font-size: 14px; text-align: center; text-decoration: none; display: block; }
        .btn-salvar { background: #007bff; color: white; }
        .btn-share { background: #25d366; color: white; display: none; }
        .btn-del { background: #dc3545; color: white; display: none; }
        .btn-voltar { text-align: center; margin-top: 15px; color: #666; text-decoration: none; display: block; font-size: 12px; }
    </style>
</head>
<body>

<div class="caixa">
    <h3 id="txtTitulo" style="text-align:center; color:#007bff; margin-top:0">CADASTRO</h3>
    <img id="preview" src="https://via.placeholder.com/120?text=FOTO">
    
    <form id="formFinal">
        <label>Anexar Foto</label>
        <input type="file" id="foto" accept="image/*">
        
        <label>Nome Completo</label>
        <input type="text" id="nome" required>
        
        <div class="duas-col">
            <div><label>CPF</label><input type="tel" id="cpf" maxlength="14"></div>
            <div><label>Nascimento</label><input type="tel" id="data" maxlength="10"></div>
        </div>
        
        <div class="duas-col">
            <div><label>Cidade</label><input type="text" id="cidade"></div>
            <div><label>UF</label><input type="text" id="uf" maxlength="2"></div>
        </div>
        
        <label>Observações</label>
        <textarea id="obs" rows="3"></textarea>

        <button type="submit" id="btnAcao" class="btn btn-salvar">💾 SALVAR E BAIXAR FOTO</button>
        <button type="button" id="btnShare" class="btn btn-share" onclick="compartilharCompleto()">📤 COMPARTILHAR (FOTO + DADOS)</button>
        <button type="button" id="btnDel" class="btn btn-del" onclick="excluir()">🗑️ EXCLUIR REGISTRO</button>
        
        <a href="index.html" class="btn-voltar">VOLTAR PARA LISTA</a>
    </form>
</div>

<script>
    const CHAVE = 'banco_final';
    const params = new URLSearchParams(window.location.search);
    const id = params.get('edit');
    let fotoBase64 = "";

    // MÁSCARAS
    document.getElementById('cpf').oninput = e => {
        let v = e.target.value.replace(/\D/g, '');
        v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        e.target.value = v;
    };
    document.getElementById('data').oninput = e => {
        let v = e.target.value.replace(/\D/g, '');
        v = v.replace(/(\d{2})(\d)/, '$1/$2').replace(/(\d{2})(\d)/, '$1/$2');
        e.target.value = v;
    };

    window.onload = () => {
        if (id !== null) {
            const lista = JSON.parse(localStorage.getItem(CHAVE) || '[]');
            const d = lista[id];
            if (d) {
                document.getElementById('btnShare').style.display = "block";
                document.getElementById('btnDel').style.display = "block";
                document.getElementById('txtTitulo').innerText = "EDITAR DADOS";
                document.getElementById('nome').value = d.nome || '';
                document.getElementById('cpf').value = d.cpf || '';
                document.getElementById('data').value = d.data || '';
                document.getElementById('cidade').value = d.cidade || '';
                document.getElementById('uf').value = d.uf || '';
                document.getElementById('obs').value = d.obs || '';
                if(d.foto) { document.getElementById('preview').src = d.foto; fotoBase64 = d.foto; }
            }
        }
    };

    // COMPARTILHAMENTO NATIVO (FOTO + TEXTO)
    async function compartilharCompleto() {
        const d = (id) => document.getElementById(id).value.toUpperCase();
        const texto = `*FICHA TÁTICA*\n*NOME:* ${d('nome')}\n*CPF:* ${d('cpf')}\n*DATA:* ${d('data')}\n*LOCAL:* ${d('cidade')}-${d('uf')}\n*OBS:* ${d('obs')}`;

        if (!navigator.share) {
            alert("Seu navegador não suporta compartilhamento de arquivos.");
            return;
        }

        try {
            const response = await fetch(fotoBase64);
            const blob = await response.blob();
            const file = new File([blob], "identificacao.jpg", { type: "image/jpeg" });

            await navigator.share({
                title: 'Ficha Operacional',
                text: texto,
                files: [file]
            });
        } catch (err) {
            // Se falhar o arquivo, tenta apenas o texto
            navigator.share({ text: texto });
        }
    }

    // SALVAR E BAIXAR FOTO
    document.getElementById('formFinal').onsubmit = e => {
        e.preventDefault();
        let lista = JSON.parse(localStorage.getItem(CHAVE) || '[]');
        const reg = {
            nome: document.getElementById('nome').value.toUpperCase(),
            cpf: document.getElementById('cpf').value,
            data: document.getElementById('data').value,
            cidade: document.getElementById('cidade').value.toUpperCase(),
            uf: document.getElementById('uf').value.toUpperCase(),
            obs: document.getElementById('obs').value.toUpperCase(),
            foto: fotoBase64
        };
        if (id !== null) lista[id] = reg; else lista.push(reg);
        localStorage.setItem(CHAVE, JSON.stringify(lista));

        // DOWNLOAD DA FOTO
        if(fotoBase64) {
            const link = document.createElement('a');
            link.href = fotoBase64;
            link.download = `${reg.nome}.jpg`;
            link.click();
        }

        alert("REGISTRO SALVO!");
        window.location.href = "index.html";
    };

    document.getElementById('foto').onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
                const cv = document.createElement('canvas');
                cv.width = 500; cv.height = 500;
                cv.getContext('2d').drawImage(img, 0, 0, 500, 500);
                fotoBase64 = cv.toDataURL('image/jpeg', 0.8);
                document.getElementById('preview').src = fotoBase64;
            };
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    function excluir() {
        if(confirm("EXCLUIR?")) {
            let lista = JSON.parse(localStorage.getItem(CHAVE));
            lista.splice(id, 1);
            localStorage.setItem(CHAVE, JSON.stringify(lista));
            window.location.href = "index.html";
        }
    }
</script>
</body>
</html>
