<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
        .caixa { background: white; padding: 20px; border-radius: 15px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 12px; color: #666; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; margin-top: 5px; }
        .duas-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        #preview { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; display: block; margin: 10px auto; border: 3px solid #007bff; background: #eee; }
        
        /* BOTÕES */
        .btn { border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; font-size: 15px; text-align: center; text-decoration: none; display: block; }
        .btn-salvar { background: #007bff; color: white; }
        .btn-foto { background: #f39c12; color: white; display: none; } /* Laranja para destaque */
        .btn-whats { background: #25d366; color: white; display: none; }
        .btn-tele { background: #0088cc; color: white; display: none; }
        .btn-del { background: #dc3545; color: white; display: none; border-top: 2px solid #eee; margin-top: 30px; }
        .btn-voltar { text-align: center; margin-top: 15px; color: #666; text-decoration: none; display: block; font-size: 14px; }
        
        .secao-compartilhar { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ccc; }
    </style>
</head>
<body>

<div class="caixa">
    <h3 id="txtTitulo" style="text-align:center; color:#007bff; margin-top:0">FICHA DE DADOS</h3>
    <img id="preview" src="https://via.placeholder.com/120">
    
    <form id="formFinal">
        <label>Foto de Perfil</label>
        <input type="file" id="foto" accept="image/*">
        
        <label>Nome Completo</label>
        <input type="text" id="nome" required>
        
        <div class="duas-col">
            <div><label>CPF</label><input type="tel" id="cpf" maxlength="14" required></div>
            <div><label>Nascimento</label><input type="tel" id="data" maxlength="10" required></div>
        </div>
        
        <div class="duas-col">
            <div><label>Cidade</label><input type="text" id="cidade"></div>
            <div><label>UF</label><input type="text" id="uf" maxlength="2"></div>
        </div>
        
        <label>Observações</label>
        <textarea id="obs" rows="3"></textarea>

        <button type="submit" id="btnAcao" class="btn btn-salvar">💾 SALVAR NO SISTEMA</button>
        
        <div class="secao-compartilhar">
            <p style="font-size: 11px; color: #888; text-align: center; margin-bottom: 5px;">COMPARTILHAMENTO EXTERNO</p>
            <button type="button" id="btnFoto" class="btn btn-foto" onclick="baixarFoto()">1º 📸 SALVAR FOTO NO CELULAR</button>
            <button type="button" id="btnTele" class="btn btn-tele" onclick="compartilharApp('telegram')">2º 🔵 ENVIAR DADOS (TELEGRAM)</button>
            <button type="button" id="btnWhats" class="btn btn-whats" onclick="compartilharApp('whatsapp')">2º 🟢 ENVIAR DADOS (WHATSAPP)</button>
        </div>
        
        <button type="button" id="btnDel" class="btn btn-del" onclick="excluir()">🗑️ APAGAR CADASTRO</button>
        
        <a href="index.html" class="btn-voltar">⬅️ VOLTAR PARA LISTA</a>
    </form>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('edit');
    let fotoBase64 = "";

    // MÁSCARAS AUTOMÁTICAS
    document.getElementById('cpf').oninput = e => {
        let v = e.target.value.replace(/\D/g, '');
        v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        e.target.value = v;
    };
    document.getElementById('data').oninput = e => {
        let v = e.target.value.replace(/\D/g, '');
        v = v.replace(/(\d{2})(\d)/, '$1/$2').replace(/(\d{2})(\d)/, '$1/$2');
        e.target.value = v;
    };

    window.onload = () => {
        if (id !== null) {
            const lista = JSON.parse(localStorage.getItem('banco_final') || '[]');
            const d = lista[id];
            if (d) {
                document.getElementById('btnFoto').style.display = "block";
                document.getElementById('btnTele').style.display = "block";
                document.getElementById('btnWhats').style.display = "block";
                document.getElementById('btnDel').style.display = "block";
                document.getElementById('nome').value = d.nome || '';
                document.getElementById('cpf').value = d.cpf || '';
                document.getElementById('data').value = d.data || '';
                document.getElementById('cidade').value = d.cidade || '';
                document.getElementById('uf').value = d.uf || '';
                document.getElementById('obs').value = d.obs || '';
                if(d.foto) { document.getElementById('preview').src = d.foto; fotoBase64 = d.foto; }
            }
        }
    };

    // PASSO 1: BAIXAR A FOTO
    function baixarFoto() {
        if (!fotoBase64) { alert("Sem foto!"); return; }
        const link = document.createElement('a');
        const nomeCli = document.getElementById('nome').value.replace(/\s+/g, '_') || 'cliente';
        link.href = fotoBase64;
        link.download = `CADASTRO_${nomeCli}.jpg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        alert("Foto salva! Agora envie os dados e anexe esta imagem no chat.");
    }

    // PASSO 2: ENVIAR TEXTO
    function compartilharApp(plataforma) {
        const n = document.getElementById('nome').value;
        const c = document.getElementById('cpf').value;
        const d = document.getElementById('data').value;
        const l = (document.getElementById('cidade').value || '') + " - " + (document.getElementById('uf').value || '');
        const o = document.getElementById('obs').value || 'Sem observações.';

        const texto = `*FICHA DE CADASTRO*%0A%0A*Nome:* ${n}%0A*CPF:* ${c}%0A*Nasc:* ${d}%0A*Local:* ${l}%0A*Obs:* ${o}`;

        if (plataforma === 'whatsapp') {
            window.location.href = `whatsapp://send?text=${texto}`;
        } else {
            window.location.href = `tg://msg?text=${texto}`;
        }
    }

    // TRATAR UPLOAD DE FOTO
    document.getElementById('foto').onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
                const cv = document.createElement('canvas');
                cv.width = 400; cv.height = 400; // Tamanho ideal para visualização
                cv.getContext('2d').drawImage(img, 0, 0, 400, 400);
                fotoBase64 = cv.toDataURL('image/jpeg', 0.8);
                document.getElementById('preview').src = fotoBase64;
            };
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    // SALVAR NO BANCO LOCAL
    document.getElementById('formFinal').onsubmit = e => {
        e.preventDefault();
        let lista = JSON.parse(localStorage.getItem('banco_final') || '[]');
        const dados = {
            nome: document.getElementById('nome').value,
            cpf: document.getElementById('cpf').value,
            data: document.getElementById('data').value,
            cidade: document.getElementById('cidade').value,
            uf: document.getElementById('uf').value,
            obs: document.getElementById('obs').value,
            foto: fotoBase64
        };
        if (id !== null) lista[id] = dados;
        else lista.push(dados);
        localStorage.setItem('banco_final', JSON.stringify(lista));
        alert("Dados salvos com sucesso!");
        window.location.href = "index.html";
    };

    function excluir() {
        if(confirm("Deseja apagar este cadastro para sempre?")) {
            let lista = JSON.parse(localStorage.getItem('banco_final'));
            lista.splice(id, 1);
            localStorage.setItem('banco_final', JSON.stringify(lista));
            window.location.href = "index.html";
        }
    }
</script>
</body>
</html>
